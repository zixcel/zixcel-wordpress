name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '35 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Install native Secret Service test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev dbus gnome-keyring
      - run: cargo test --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: bash scripts/acceptance/keyring.sh
      - run: cargo build --locked --features os-keyring --bin zix-wordpress
      - run: target/debug/zix-wordpress --version
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
