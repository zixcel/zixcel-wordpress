[package]
name = "zixcel-wordpress"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-wordpress"
description = "Origin-bound WordPress core authentication and explicit draft operations"
publish = false
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "json"] }
zeroize = "1.9"
base64 = "0.22"
sha2 = "0.11"
getrandom = "0.4"
crowsi-credential-broker = { git = "https://github.com/crowsi-net/credential-custody", rev = "8b19f4812e5be89f08a1d08d58ffccf482a16969", default-features = false, features = ["linux-secret-service"], optional = true }
zix-cli = { git = "https://github.com/zixcel/cli", rev = "3eedec27bad3a1856e174176bb0770081404483e", optional = true }
crowsi-transport-foundation = { git = "https://github.com/crowsi-net/crowsi-transport-foundation", rev = "f5edce4df5b58e90224ad05390d79fe2f571b4a5", features = ["http-contract"] }
[dev-dependencies]
tempfile = "3.27"
[features]
os-keyring = ["dep:crowsi-credential-broker"]
release-tool = ["dep:zix-cli"]
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
[[bin]]
name = "zix-wordpress"
path = "src/main.rs"
[[bin]]
name = "zix-wordpress-package"
path = "tools/package.rs"
required-features = ["release-tool"]
